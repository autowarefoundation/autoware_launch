autoware_system_design_format: 0.3.0

name: sample_system_sensing.parameter_set

parameters:
  - node: /sensing/vehicle_velocity_converter
    param_files: []
    param_values:
      - name: use_sim_time
        value: false
  - node: /sensing/lidar/top/lidar
    param_files: []
    param_values:
      - name: sensor_model
        value: VLS128
      - name: return_mode
        value: SingleStrongest
      - name: max_range
        value: 250.0
      - name: min_range
        value: 0.5
      - name: frame_id
        value: velodyne_top
      - name: sensor_ip
        value: 192.168.1.201
      - name: host_ip
        value: 192.168.1.10
      - name: data_port
        value: 2368
      - name: scan_phase
        value: 300.0
      - name: cloud_min_angle
        value: 0
      - name: cloud_max_angle
        value: 360
      - name: udp_only
        value: false
      - name: use_sim_time
        value: false
  - node: /sensing/lidar/top/crop_box_filter_self
    param_files:
      - crop_box_filter_param_file: $(find-pkg-share autoware_sample_designs)/config/sample_vehicle/crop_box_self.param.yaml
    param_values:
      - name: input_frame
        value: base_link
      - name: output_frame
        value: base_link
      - name: use_sim_time
        value: false
      - name: processing_time_threshold_sec
        value: 0.01
  - node: /sensing/lidar/top/crop_box_filter_wheels
