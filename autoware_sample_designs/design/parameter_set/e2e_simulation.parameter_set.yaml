autoware_system_design_format: 0.3.0

name: e2e_simulation.parameter_set
parameters:
  - node: /*
    param_files: []
    param_values:
      - name: use_sim_time
        value: true
  - node: /localization/util/pose_initializer
    param_files: []
    param_values:
      - name: stop_check_enabled
        value: true
  - node: /global_parameter_loader
    param_files: []
    param_values:
      - name: use_sim_time
        value: true
  - node: /system/aggregator
    param_values:
      - name: graph_file
        value: $(find-pkg-share autoware_launch)/config/system/diagnostics/autoware-awsim.yaml
