  - node: /system/system_monitor/voltage_monitor
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/system_monitor/voltage_monitor.param.yaml
  - node: /system/duplicated_node_checker
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/duplicated_node_checker/duplicated_node_checker.param.yaml
  - node: /system/processing_time_checker
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/processing_time_checker/processing_time_checker.param.yaml
  - node: /system/pipeline_latency_monitor
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/pipeline_latency_monitor/pipeline_latency_monitor.param.yaml
  - node: /system/mrm_comfortable_stop_operator
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/mrm_comfortable_stop_operator/mrm_comfortable_stop_operator.param.yaml
  - node: /system/mrm_emergency_stop_operator
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/mrm_emergency_stop_operator/mrm_emergency_stop_operator.param.yaml
  - node: /system/mrm_handler
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/mrm_handler/mrm_handler.param.yaml
  - node: /system/converter
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/command_mode/converter.param.yaml
  - node: /system/aggregator
    param_values:
      - name: graph_file
        value: $(find-pkg-share autoware_launch)/config/system/diagnostics/autoware-main.yaml
  - node: /system/logging_diag_graph
    param_values:
      - name: show_rate
        value: 10.0
      - name: enable_terminal_log
        value: true
  - node: /system/component_state_monitor/component
    param_values:
      - name: launch.map
        value:
          [
            "topic_state_monitor_vector_map: map_topic_status",
            "topic_state_monitor_pointcloud_map: map_topic_status",
          ]
      - name: autonomous.localization
        value:
          [
            "topic_state_monitor_pose_twist_fusion_filter_pose: localization_topic_status",
            "topic_state_monitor_transform_map_to_base_link: localization_topic_status",
          ]
      - name: launch.perception
        value: ["topic_state_monitor_obstacle_segmentation_pointcloud: perception_topic_status"]
      - name: autonomous.perception
        value:
          [
            "topic_state_monitor_object_recognition_objects: perception_topic_status",
            "topic_state_monitor_traffic_light_recognition_traffic_signals: perception_topic_status",
          ]
      - name: autonomous.planning
        value:
          [
            "topic_state_monitor_mission_planning_route: planning_topic_status",
            "topic_state_monitor_scenario_planning_trajectory: planning_topic_status",
          ]
      - name: autonomous.control
        value:
          [
            "topic_state_monitor_trajectory_follower_control_cmd: control_topic_status",
            "topic_state_monitor_control_command_control_cmd: control_topic_status",
          ]
      - name: autonomous.vehicle
        value:
          [
            "topic_state_monitor_vehicle_status_velocity_status: vehicle_topic_status",
            "topic_state_monitor_vehicle_status_steering_status: vehicle_topic_status",
          ]
      - name: launch.system
        value: ["topic_state_monitor_system_emergency_control_cmd: system_topic_status"]
  - node: /system/component_state_monitor/topic_state_monitor_vector_map
    param_values:
      - name: topic
        value: /map/vector_map
      - name: topic_type
        value: autoware_map_msgs/msg/LaneletMapBin
      - name: best_effort
        value: false
      - name: transient_local
        value: true
      - name: diag_name
        value: map_topic_status
      - name: warn_rate
        value: 0.0
      - name: error_rate
        value: 0.0
      - name: timeout
