autoware_system_design_format: 0.3.0

name: universe_system.parameter_set
parameters:
  - node: /system/system_monitor/cpu_monitor
    param_files:
      - param_file: $(find-pkg-share autoware_launch)/config/system/system_monitor/cpu_monitor.param.yaml
  - node: /system/system_monitor/mem_monitor
    param_files:
