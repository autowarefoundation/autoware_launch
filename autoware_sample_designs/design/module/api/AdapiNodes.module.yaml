autoware_system_design_format: 0.3.1

# module information
# AD API default implementation: one composable node per API domain.
name: AdapiNodes.module

instances:
  - name: node/interface
    entity: AdapiInterface.node
  - name: node/localization
    entity: AdapiLocalization.node
  - name: node/routing
    entity: AdapiRouting.node
  - name: node/autoware_state
    entity: AdapiAutowareState.node
  - name: node/diagnostics
    entity: AdapiDiagnostics.node
  - name: node/fail_safe
    entity: AdapiFailSafe.node
  - name: node/heartbeat
    entity: AdapiHeartbeat.node
  - name: node/manual/local
    entity: AdapiManualControl.node
  - name: node/manual/remote
    entity: AdapiManualControl.node
  - name: node/motion
    entity: AdapiMotion.node
  - name: node/mrm_request
    entity: AdapiMrmRequest.node
  - name: node/operation_mode
    entity: AdapiOperationMode.node
  - name: node/perception
    entity: AdapiPerception.node
  - name: node/planning
    entity: AdapiPlanning.node
  - name: node/vehicle_status
    entity: AdapiVehicleStatus.node
  - name: node/vehicle_command
    entity: AdapiVehicleCommand.node
  - name: node/vehicle_metrics
    entity: AdapiVehicleMetrics.node
  - name: node/vehicle_info
    entity: AdapiVehicleInfo.node
  - name: node/vehicle_door
    entity: AdapiVehicleDoor.node

# interfaces
subscribers:
  - name: localization/initialization_state
  - name: localization/kinematic_state
  - name: localization/acceleration
  - name: map/map_projector_info
  - name: planning/route
  - name: planning/route_state
  - name: planning/trajectory
  - name: system/operation_mode/state
  - name: system/operation_mode/availability
  - name: system/fail_safe/mrm_state
  - name: system/diagnostics_graph/struct
  - name: system/diagnostics_graph/status
  - name: control/command/control_cmd
  - name: control/vehicle_cmd_gate/is_paused
  - name: control/vehicle_cmd_gate/is_start_requested
  - name: vehicle/status/gear_status
  - name: vehicle/status/steering_status
  - name: vehicle/status/turn_indicators_status
  - name: vehicle/status/hazard_lights_status
  - name: vehicle/doors/status
  - name: perception/object_recognition/objects
  - name: system/component_state_monitor/component/launch/sensing
  - name: system/component_state_monitor/component/launch/perception
  - name: system/component_state_monitor/component/launch/map
  - name: system/component_state_monitor/component/launch/localization
  - name: system/component_state_monitor/component/launch/planning
  - name: system/component_state_monitor/component/launch/control
  - name: system/component_state_monitor/component/launch/vehicle
  - name: system/component_state_monitor/component/launch/system
  - name: vehicle/status/battery_charge
  - name: control/command/actuation_cmd
  # Planning factor subscriptions mirror the fixed topic list in the default
  # AD API planning node; entries without a launched planning module stay
  # unconnected and silent.
  - name: planning/planning_factors/behavior_path_planner
  - name: planning/planning_factors/blind_spot
  - name: planning/planning_factors/crosswalk
  - name: planning/planning_factors/detection_area
  - name: planning/planning_factors/dynamic_obstacle_stop
  - name: planning/planning_factors/intersection
  - name: planning/planning_factors/merge_from_private
  - name: planning/planning_factors/no_stopping_area
  - name: planning/planning_factors/obstacle_cruise_planner
  - name: planning/planning_factors/obstacle_stop_planner
  - name: planning/planning_factors/obstacle_stop
  - name: planning/planning_factors/obstacle_cruise
  - name: planning/planning_factors/obstacle_slow_down
  - name: planning/planning_factors/occlusion_spot
  - name: planning/planning_factors/run_out
  - name: planning/planning_factors/stop_line
  - name: planning/planning_factors/surround_obstacle_checker
  - name: planning/planning_factors/traffic_light
  - name: planning/planning_factors/virtual_traffic_light
  - name: planning/planning_factors/walkway
  - name: planning/planning_factors/motion_velocity_planner
  - name: planning/planning_factors/static_obstacle_avoidance
  - name: planning/planning_factors/dynamic_obstacle_avoidance
  - name: planning/planning_factors/avoidance_by_lane_change
  - name: planning/planning_factors/lane_change_left
  - name: planning/planning_factors/lane_change_right
  - name: planning/planning_factors/start_planner
  - name: planning/planning_factors/goal_planner
  - name: planning/planning_factors/roundabout

publishers:
  # AD API topics
  - name: api/localization/initialization_state
  - name: api/routing/state
  - name: api/routing/route
  - name: api/operation_mode/state
  - name: api/motion/state
  - name: api/fail_safe/mrm_state
  - name: api/fail_safe/mrm_request/list
  - name: api/system/diagnostics/struct
  - name: api/system/diagnostics/status
  - name: api/system/heartbeat
  - name: api/perception/objects
  - name: api/planning/velocity_factors
  - name: api/planning/steering_factors
  - name: api/vehicle/kinematics
  - name: api/vehicle/status
  - name: api/vehicle/metrics
  - name: api/vehicle/doors/status
  - name: api/control/command/pedals
  - name: api/control/command/acceleration
  - name: api/control/command/velocity
  - name: api/control/command/steering
  # compatibility topics
  - name: autoware/state
  # manual command relay topics
  - name: external/local/gear_cmd
  - name: external/local/hazard_lights_cmd
  - name: external/local/heartbeat
  - name: external/local/pedals_cmd
  - name: external/local/steering_cmd
  - name: external/local/turn_indicators_cmd
  - name: external/remote/gear_cmd
  - name: external/remote/hazard_lights_cmd
  - name: external/remote/heartbeat
  - name: external/remote/pedals_cmd
  - name: external/remote/steering_cmd
  - name: external/remote/turn_indicators_cmd

servers:
  # AD API services
  - name: api/interface/version
  - name: api/localization/initialize
  - name: api/routing/clear_route
  - name: api/routing/set_route
  - name: api/routing/set_route_points
  - name: api/routing/change_route
  - name: api/routing/change_route_points
  - name: api/operation_mode/change_to_stop
  - name: api/operation_mode/change_to_autonomous
  - name: api/operation_mode/change_to_local
  - name: api/operation_mode/change_to_remote
  - name: api/operation_mode/enable_autoware_control
  - name: api/operation_mode/disable_autoware_control
  - name: api/motion/accept_start
  - name: api/fail_safe/list_mrm_description
  - name: api/fail_safe/mrm_request/send
  - name: api/system/diagnostics/reset
  - name: api/vehicle/dimensions
  - name: api/vehicle/doors/command
  - name: api/vehicle/doors/layout
  # compatibility services
  - name: autoware/shutdown

clients:
  - name: routing/clear_route
  - name: planning/set_lanelet_route
  - name: planning/set_waypoint_route
  - name: system/operation_mode/change_operation_mode
  - name: system/operation_mode/change_autoware_control
  - name: system/diagnostics_graph/reset
  - name: control/vehicle_cmd_gate/set_pause
  - name: localization/initialize
  - name: vehicle/doors/command
  - name: vehicle/doors/layout

connections:
  # Sibling-node inputs; wired before the boundary export so the exported
  # topic names win.
  - - node/localization.publisher.initialization_state
    - node/autoware_state.subscriber.localization_state
  - - node/routing.publisher.state
    - node/autoware_state.subscriber.routing_state
  - - node/operation_mode.publisher.state
    - node/autoware_state.subscriber.operation_mode_state
  - - node/operation_mode.publisher.state
    - node/manual/local.subscriber.operation_mode_state
  - - node/operation_mode.publisher.state
    - node/manual/remote.subscriber.operation_mode_state
  - - node/fail_safe.publisher.mrm_state
    - node/diagnostics.subscriber.mrm_state

  # localization
  - - subscriber.localization/initialization_state
    - node/localization.subscriber.initialization_state
  - - node/localization.client.initialize
    - client.localization/initialize
  - - node/localization.publisher.^
    - publisher.api/localization/^
  - - node/localization.server.initialize
    - server.api/localization/initialize

  # interface
  - - node/interface.server.^
    - server.api/interface/^

  # routing
  - - subscriber.planning/route
    - node/routing.subscriber.route
  - - subscriber.planning/route_state
    - node/routing.subscriber.route_state
  - - subscriber.system/operation_mode/state
    - node/routing.subscriber.operation_mode_state
  - - subscriber.localization/kinematic_state
    - node/routing.subscriber.kinematic_state
  - - node/routing.client.clear_route
    - client.routing/clear_route
  - - node/routing.client.set_lanelet_route
    - client.planning/set_lanelet_route
  - - node/routing.client.set_waypoint_route
    - client.planning/set_waypoint_route
  - - node/routing.client.change_operation_mode
    - client.system/operation_mode/change_operation_mode
  - - node/routing.publisher.^
    - publisher.api/routing/^
  - - node/routing.server.clear_route
    - server.api/routing/clear_route
  - - node/routing.server.set_route
    - server.api/routing/set_route
  - - node/routing.server.set_route_points
    - server.api/routing/set_route_points
  - - node/routing.server.change_route
    - server.api/routing/change_route
  - - node/routing.server.change_route_points
    - server.api/routing/change_route_points

  # operation mode
  - - subscriber.system/operation_mode/state
    - node/operation_mode.subscriber.operation_mode_state
  - - subscriber.system/operation_mode/availability
    - node/operation_mode.subscriber.availability
  - - node/operation_mode.client.change_operation_mode
    - client.system/operation_mode/change_operation_mode
  - - node/operation_mode.client.change_autoware_control
    - client.system/operation_mode/change_autoware_control
  - - node/operation_mode.publisher.^
    - publisher.api/operation_mode/^
  - - node/operation_mode.server.change_to_stop
    - server.api/operation_mode/change_to_stop
  - - node/operation_mode.server.change_to_autonomous
    - server.api/operation_mode/change_to_autonomous
  - - node/operation_mode.server.change_to_local
    - server.api/operation_mode/change_to_local
  - - node/operation_mode.server.change_to_remote
    - server.api/operation_mode/change_to_remote
  - - node/operation_mode.server.enable_autoware_control
    - server.api/operation_mode/enable_autoware_control
  - - node/operation_mode.server.disable_autoware_control
    - server.api/operation_mode/disable_autoware_control

  # autoware state
  - - subscriber.system/component_state_monitor/component/launch/^
    - node/autoware_state.subscriber.launch_state_^
  - - node/autoware_state.publisher.autoware_state
    - publisher.autoware/state
  - - node/autoware_state.server.^
    - server.autoware/^

  # diagnostics
  - - subscriber.system/diagnostics_graph/struct
    - node/diagnostics.subscriber.struct
  - - subscriber.system/diagnostics_graph/status
    - node/diagnostics.subscriber.status
  - - node/diagnostics.client.reset
    - client.system/diagnostics_graph/reset
  - - node/diagnostics.publisher.^
    - publisher.api/system/diagnostics/^
  - - node/diagnostics.server.reset
    - server.api/system/diagnostics/reset

  # fail safe
  - - subscriber.system/fail_safe/mrm_state
    - node/fail_safe.subscriber.mrm_state
  - - node/fail_safe.publisher.^
    - publisher.api/fail_safe/^
  - - node/fail_safe.server.list_mrm_description
    - server.api/fail_safe/list_mrm_description
  - - node/mrm_request.publisher.^
    - publisher.api/fail_safe/^
  - - node/mrm_request.server.mrm_request/send
    - server.api/fail_safe/mrm_request/send

  # heartbeat
  - - node/heartbeat.publisher.^
    - publisher.api/system/^

  # manual control
  - - node/manual/local.publisher.^
    - publisher.external/local/^
  - - node/manual/remote.publisher.^
    - publisher.external/remote/^

  # motion
  - - subscriber.localization/kinematic_state
    - node/motion.subscriber.kinematic_state
  - - subscriber.control/vehicle_cmd_gate/is_paused
    - node/motion.subscriber.is_paused
  - - subscriber.control/vehicle_cmd_gate/is_start_requested
    - node/motion.subscriber.is_start_requested
  - - node/motion.client.set_pause
    - client.control/vehicle_cmd_gate/set_pause
  - - node/motion.publisher.^
    - publisher.api/motion/^
  - - node/motion.server.accept_start
    - server.api/motion/accept_start

  # perception
  - - subscriber.perception/object_recognition/objects
    - node/perception.subscriber.objects
  - - node/perception.publisher.^
    - publisher.api/perception/^

  # planning
  - - subscriber.planning/trajectory
    - node/planning.subscriber.trajectory
  - - subscriber.localization/kinematic_state
    - node/planning.subscriber.kinematic_state
  - - subscriber.planning/planning_factors/^
    - node/planning.subscriber.planning_factors/^
  - - node/planning.publisher.^
    - publisher.api/planning/^

  # vehicle status
  - - subscriber.localization/kinematic_state
    - node/vehicle_status.subscriber.kinematic_state
  - - subscriber.localization/acceleration
    - node/vehicle_status.subscriber.acceleration
  - - subscriber.map/map_projector_info
    - node/vehicle_status.subscriber.map_projector_info
  - - subscriber.vehicle/status/gear_status
    - node/vehicle_status.subscriber.gear_status
  - - subscriber.vehicle/status/steering_status
    - node/vehicle_status.subscriber.steering_status
  - - subscriber.vehicle/status/turn_indicators_status
    - node/vehicle_status.subscriber.turn_indicators_status
  - - subscriber.vehicle/status/hazard_lights_status
    - node/vehicle_status.subscriber.hazard_lights_status
  - - subscriber.vehicle/status/battery_charge
    - node/vehicle_status.subscriber.battery_charge
  - - subscriber.vehicle/status/battery_charge
    - node/vehicle_metrics.subscriber.battery_charge
  - - node/vehicle_status.publisher.^
    - publisher.api/vehicle/^
  - - node/vehicle_metrics.publisher.^
    - publisher.api/vehicle/^
  - - node/vehicle_info.server.^
    - server.api/vehicle/^

  # vehicle command
  - - subscriber.control/command/control_cmd
    - node/vehicle_command.subscriber.control_cmd
  - - subscriber.control/command/actuation_cmd
    - node/vehicle_command.subscriber.actuation_cmd
  - - node/vehicle_command.publisher.^
    - publisher.api/control/command/^

  # vehicle door
  - - subscriber.vehicle/doors/status
    - node/vehicle_door.subscriber.door_status
  - - subscriber.system/operation_mode/state
    - node/vehicle_door.subscriber.operation_mode_state
  - - node/vehicle_door.client.command
    - client.vehicle/doors/command
  - - node/vehicle_door.client.layout
    - client.vehicle/doors/layout
  - - node/vehicle_door.publisher.^
    - publisher.api/vehicle/doors/^
  - - node/vehicle_door.server.command
    - server.api/vehicle/doors/command
  - - node/vehicle_door.server.layout
    - server.api/vehicle/doors/layout
