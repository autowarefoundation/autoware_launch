autoware_system_design_format: 0.3.1

# module information
# AD API layer: default API nodes, RViz helper adaptors and the external RTC controller.
name: Adapi.module

instances:
  - name: adapi/node
    entity: AdapiNodes.module
  - name: default_adapi/helpers
    entity: AdapiRvizHelpers.module
  - name: autoware_api/external/rtc_controller/node
    entity: AdapiRtcController.node

# interfaces
subscribers:
  - name: localization/initialization_state
  - name: localization/kinematic_state
  - name: localization/acceleration
  - name: map/map_projector_info
  - name: map/pointcloud_map
  - name: map/vector_map
  - name: planning/route
  - name: planning/route_state
  - name: planning/trajectory
  - name: system/operation_mode/state
  - name: system/operation_mode/availability
  - name: system/fail_safe/mrm_state
  - name: system/diagnostics_graph/struct
  - name: system/diagnostics_graph/status
  - name: control/command/control_cmd
  - name: control/vehicle_cmd_gate/is_paused
  - name: control/vehicle_cmd_gate/is_start_requested
  - name: vehicle/status/gear_status
  - name: vehicle/status/steering_status
  - name: vehicle/status/turn_indicators_status
  - name: vehicle/status/hazard_lights_status
  - name: vehicle/doors/status
  - name: perception/object_recognition/objects
  - name: system/component_state_monitor/component/launch/sensing
  - name: system/component_state_monitor/component/launch/perception
  - name: system/component_state_monitor/component/launch/map
  - name: system/component_state_monitor/component/launch/localization
  - name: system/component_state_monitor/component/launch/planning
  - name: system/component_state_monitor/component/launch/control
  - name: system/component_state_monitor/component/launch/vehicle
  - name: system/component_state_monitor/component/launch/system
  - name: vehicle/status/battery_charge
  - name: control/command/actuation_cmd
  - name: planning/planning_factors/behavior_path_planner
  - name: planning/planning_factors/blind_spot
  - name: planning/planning_factors/crosswalk
  - name: planning/planning_factors/detection_area
  - name: planning/planning_factors/dynamic_obstacle_stop
  - name: planning/planning_factors/intersection
  - name: planning/planning_factors/merge_from_private
  - name: planning/planning_factors/no_stopping_area
  - name: planning/planning_factors/obstacle_cruise_planner
  - name: planning/planning_factors/obstacle_stop_planner
  - name: planning/planning_factors/obstacle_stop
  - name: planning/planning_factors/obstacle_cruise
  - name: planning/planning_factors/obstacle_slow_down
  - name: planning/planning_factors/occlusion_spot
  - name: planning/planning_factors/run_out
  - name: planning/planning_factors/stop_line
  - name: planning/planning_factors/surround_obstacle_checker
  - name: planning/planning_factors/traffic_light
  - name: planning/planning_factors/virtual_traffic_light
  - name: planning/planning_factors/walkway
  - name: planning/planning_factors/motion_velocity_planner
  - name: planning/planning_factors/static_obstacle_avoidance
  - name: planning/planning_factors/dynamic_obstacle_avoidance
  - name: planning/planning_factors/avoidance_by_lane_change
  - name: planning/planning_factors/lane_change_left
  - name: planning/planning_factors/lane_change_right
  - name: planning/planning_factors/start_planner
  - name: planning/planning_factors/goal_planner
  - name: planning/planning_factors/roundabout

publishers:
  # AD API topics
  - name: api/localization/initialization_state
  - name: api/routing/state
  - name: api/routing/route
  - name: api/operation_mode/state
  - name: api/motion/state
  - name: api/fail_safe/mrm_state
  - name: api/fail_safe/mrm_request/list
  - name: api/system/diagnostics/struct
  - name: api/system/diagnostics/status
  - name: api/system/heartbeat
  - name: api/perception/objects
  - name: api/planning/velocity_factors
  - name: api/planning/steering_factors
  - name: api/vehicle/kinematics
  - name: api/vehicle/status
  - name: api/vehicle/metrics
  - name: api/vehicle/doors/status
  - name: api/control/command/pedals
  - name: api/control/command/acceleration
  - name: api/control/command/velocity
  - name: api/control/command/steering
  - name: api/external/get/rtc_status
  - name: api/external/get/rtc_auto_mode
  # compatibility topics
  - name: autoware/state
  # manual command relay topics
  - name: external/local/gear_cmd
  - name: external/local/hazard_lights_cmd
  - name: external/local/heartbeat
  - name: external/local/pedals_cmd
  - name: external/local/steering_cmd
  - name: external/local/turn_indicators_cmd
  - name: external/remote/gear_cmd
  - name: external/remote/hazard_lights_cmd
  - name: external/remote/heartbeat
  - name: external/remote/pedals_cmd
  - name: external/remote/steering_cmd
  - name: external/remote/turn_indicators_cmd

servers:
  # AD API services
  - name: api/interface/version
  - name: api/localization/initialize
  - name: api/routing/clear_route
  - name: api/routing/set_route
  - name: api/routing/set_route_points
  - name: api/routing/change_route
  - name: api/routing/change_route_points
  - name: api/operation_mode/change_to_stop
  - name: api/operation_mode/change_to_autonomous
  - name: api/operation_mode/change_to_local
  - name: api/operation_mode/change_to_remote
  - name: api/operation_mode/enable_autoware_control
  - name: api/operation_mode/disable_autoware_control
  - name: api/motion/accept_start
  - name: api/fail_safe/list_mrm_description
  - name: api/fail_safe/mrm_request/send
  - name: api/system/diagnostics/reset
  - name: api/vehicle/dimensions
  - name: api/vehicle/doors/command
  - name: api/vehicle/doors/layout
  - name: api/external/set/rtc_commands
  - name: api/external/set/rtc_auto_mode
  # compatibility services
  - name: autoware/shutdown

clients:
  - name: routing/clear_route
  - name: planning/set_lanelet_route
  - name: planning/set_waypoint_route
  - name: system/operation_mode/change_operation_mode
  - name: system/operation_mode/change_autoware_control
  - name: system/diagnostics_graph/reset
  - name: control/vehicle_cmd_gate/set_pause
  - name: localization/initialize
  - name: vehicle/doors/command
  - name: vehicle/doors/layout
  - name: map/get_partial_pointcloud_map

connections:
  # RViz helper inputs from the default API nodes; wired before the boundary
  # export so the exported topic names win.
  - - adapi/node.publisher.api/^
    - default_adapi/helpers.subscriber.api/^

  # default API nodes
  - - subscriber.^
    - adapi/node.subscriber.^
  - - adapi/node.publisher.^
    - publisher.^
  - - adapi/node.client.routing/clear_route
    - client.routing/clear_route
  - - adapi/node.client.planning/set_lanelet_route
    - client.planning/set_lanelet_route
  - - adapi/node.client.planning/set_waypoint_route
    - client.planning/set_waypoint_route
  - - adapi/node.client.system/operation_mode/change_operation_mode
    - client.system/operation_mode/change_operation_mode
  - - adapi/node.client.system/operation_mode/change_autoware_control
    - client.system/operation_mode/change_autoware_control
  - - adapi/node.client.system/diagnostics_graph/reset
    - client.system/diagnostics_graph/reset
  - - adapi/node.client.control/vehicle_cmd_gate/set_pause
    - client.control/vehicle_cmd_gate/set_pause
  - - adapi/node.client.localization/initialize
    - client.localization/initialize
  - - adapi/node.client.vehicle/doors/command
    - client.vehicle/doors/command
  - - adapi/node.client.vehicle/doors/layout
    - client.vehicle/doors/layout

  # RViz helpers
  - - subscriber.map/pointcloud_map
    - default_adapi/helpers.subscriber.pointcloud_map
  - - subscriber.map/vector_map
    - default_adapi/helpers.subscriber.vector_map
  - - default_adapi/helpers.client.partial_map_load
    - client.map/get_partial_pointcloud_map

  # external RTC controller
  - - autoware_api/external/rtc_controller/node.publisher.^
    - publisher.api/external/^
