autoware_system_design_format: 0.3.1

# module information
# Per-topic state monitors aggregated into component launch/autonomous availability.
# The monitored topics are parameters of each topic_state_monitor instance.
name: ComponentStateMonitor.module

instances:
  - name: component
    entity: ComponentStateMonitor.node
  - name: topic_state_monitor_vector_map
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_pointcloud_map
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_pose_twist_fusion_filter_pose
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_obstacle_segmentation_pointcloud
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_object_recognition_objects
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_traffic_light_recognition_traffic_signals
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_mission_planning_route
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_scenario_planning_trajectory
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_trajectory_follower_control_cmd
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_control_command_control_cmd
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_vehicle_status_velocity_status
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_vehicle_status_steering_status
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_system_emergency_control_cmd
    entity: TopicStateMonitor.node
  - name: topic_state_monitor_transform_map_to_base_link
    entity: TopicStateMonitor.node

# interfaces
subscribers: []

publishers:
  - name: component/launch/sensing
  - name: component/launch/perception
  - name: component/launch/map
  - name: component/launch/localization
  - name: component/launch/planning
  - name: component/launch/control
  - name: component/launch/vehicle
  - name: component/launch/system
  - name: component/autonomous/sensing
  - name: component/autonomous/perception
  - name: component/autonomous/map
  - name: component/autonomous/localization
  - name: component/autonomous/planning
  - name: component/autonomous/control
  - name: component/autonomous/vehicle
  - name: component/autonomous/system

connections:
  - - component.publisher.^
    - publisher.component/^
