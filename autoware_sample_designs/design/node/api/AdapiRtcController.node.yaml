autoware_system_design_format: 0.4.0

# node information
name: AdapiRtcController.node

description: Aggregates the RTC cooperate and auto mode statuses of all planning modules for the external API and dispatches cooperate commands and auto mode requests to each module.

package:
  name: autoware_iv_external_api_adaptor
  provider: autoware

launch:
  plugin: external_api::RTCController
  node_output: screen

