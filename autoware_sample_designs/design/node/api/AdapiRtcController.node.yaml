# parameters
param_files: []

param_values: []

# processes
processes:
  - name: publish_rtc_status
    description: Periodically merges and sorts the cooperate statuses of all modules and publishes them.
    trigger_conditions:
      - periodic: 10.0
    outcomes:
      - to_output: get/rtc_status
  - name: publish_auto_mode
    description: Periodically merges the auto mode statuses of all modules and publishes them.
    trigger_conditions:
      - periodic: 10.0
    outcomes:
      - to_output: get/rtc_auto_mode
