autoware_system_design_format: 0.3.0

name: SampleSystemRobotStatePublisher.node

package:
  name: robot_state_publisher
  provider: ros

launch:
  executable: robot_state_publisher
  node_output: screen

# interface
subscribers:
  - name: robot_description
    message_type: std_msgs/msg/String
  - name: joint_states
    message_type: sensor_msgs/msg/JointState
    remap_target: joint_states
publishers:
  - name: robot_description
    message_type: std_msgs/msg/String
    remap_target: robot_description
    global: /robot_description
  - name: tf
    message_type: tf2_msgs/msg/TFMessage
    global: /tf
  - name: tf_static
    message_type: tf2_msgs/msg/TFMessage
    global: /tf_static

# parameters
param_files:
  - name: robot_description_param_file
    default: $(find-pkg-share autoware_sample_designs)/config/sample_vehicle/robot_description.param.yaml
param_values: []

processes:
  - name: run
    trigger_conditions: []
    outcomes: []
