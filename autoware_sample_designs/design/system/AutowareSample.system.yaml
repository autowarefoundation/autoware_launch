autoware_system_design_format: 0.3.2

name: AutowareSample.system

variables:
  # common variables
  - name: config_path
    value: $(find-pkg-share autoware_sample_designs)/config
  - name: vehicle_model
    value: sample_vehicle
  - name: data_path
    value: $(env HOME)/autoware_data/ml_models
  - name: lanelet2_map_file
    value: lanelet2_map.osm
  - name: pointcloud_map_file
    value: pointcloud_map.pcd
  # vehicle-specific variables
  - name: config_dir
    value: $(find-pkg-share sample_sensor_kit_description)/config
  # environment variables
  - name: map_path
    value: $(env HOME)/autoware_data/maps/sample-map-rosbag
  - name: check_external_emergency_heartbeat
    value: false

variable_files:
  - name: vehicle_info
    value: $(find-pkg-share sample_vehicle_description)/config/vehicle_info.param.yaml

modes:
  - name: Runtime
    description: on-vehicle runtime mode
    default: true
  - name: LoggingSimulation
    description: Logged data replay simulation mode
  - name: PlanningSimulation
    description: Planning simulation mode
  - name: E2ESimulation
    description: E2E simulation mode using AWSIM

parameter_sets:
  # - runtime.parameter_set
  []

components:
  # Middleware
  - name: global_parameter_loader
    entity: GlobalParameterLoader.node
    path: /ros2_system/global_parameter_loader
    compute_unit: main_ecu
    parameter_set: sample_system_global_parameter_loader.parameter_set
  - name: robot_state_publisher
    entity: SampleSystemRobotStatePublisher.node
    path: /ros2_system/robot_state_publisher
    compute_unit: main_ecu

  # ADAPI
  - name: adapi
    entity: AdapiNodes.module
    compute_unit: main_ecu
    parameter_set: universe_adapi.parameter_set
  - name: default_adapi
    entity: AdapiRvizHelpers.module
    compute_unit: main_ecu
  - name: autoware_api
    entity: AdapiExternalApi.module
    compute_unit: main_ecu

  # SENSING
  - name: sensing
    entity: SampleSensorKit.module
    compute_unit: main_ecu
    parameter_set: sample_system_sensing.parameter_set

  # MAP/LOCALIZATION
  - name: map
    entity: Map.module
    compute_unit: main_ecu
    parameter_set: universe_map.parameter_set
  - name: localization
    entity: Localization.module
    compute_unit: main_ecu
    parameter_set: universe_localization.parameter_set

  # PERCEPTION
  - name: perception
    entity: Perception.module
    compute_unit: main_ecu
    parameter_set: sample_system_perception.parameter_set

  # PLANNING
  - name: planning
    entity: Planning.module
    compute_unit: main_ecu
    parameter_set: universe_planning.parameter_set
  # CONTROL
  - name: control
    entity: Control.module
    compute_unit: main_ecu
    parameter_set: universe_control.parameter_set

  # VEHICLE
  - name: vehicle
    entity: SampleSystemVehicleWrapper.node
    path: /
    compute_unit: main_ecu

  # SYSTEM
  - name: system
    entity: Tier4SystemWrapper.node
    compute_unit: main_ecu

  # # VISUALIZATION
  # - name: visualization
  #   entity: Rviz.node
  #   compute_unit: main_ecu

node_groups:
  - name: pointcloud_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /sensing/lidar/concatenate_and_time_sync
      - /localization/util/crop_box_filter_measurement_range
      - /localization/util/voxel_grid_downsample_filter
      - /localization/util/random_downsample_filter
      - /perception/occupancy_grid_map/occupancy_grid_map_node
  - name: lidar_top_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /sensing/lidar/top/*
  - name: lidar_left_container
    type: ros2_component_container_ipc
    nodes:
      - /sensing/lidar/left/*
  - name: lidar_right_container
    type: ros2_component_container_ipc
    nodes:
      - /sensing/lidar/right/*
  - name: traffic_light_node_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /perception/traffic_light_recognition/camera1/detection
      - /perception/traffic_light_recognition/camera1/classifier_pedestrian
      - /perception/traffic_light_recognition/camera1/classifier_car
      # - /perception/traffic_light_recognition/camera1/occlusion_predictor
  - name: control_container
    type: ros2_component_container_mt
    nodes:
      - /control/trajectory_follower/controller_node_exe
      - /control/command_gate/shift_decider
      - /control/command_gate/vehicle_cmd_gate
      - /control/command_gate/autoware_operation_mode_transition_manager
  - name: control_check_container
    type: ros2_component_container_mt
    nodes:
      - /control/trajectory_follower/lane_departure_checker_node
      - /control/control_checker/control_validator
      - /control/control_checker/autonomous_emergency_braking
      - /control/control_checker/collision_detector
  - name: mission_planner_container
    type: ros2_component_container_mt
    nodes:
      - /planning/mission_planning/mission_planner
      - /planning/mission_planning/route_selector
  - name: adapi_container
    type: ros2_component_container_mt
    nodes:
      - /adapi/*
  - name: rtc_controller_container
    type: ros2_component_container_mt
    nodes:
      - /autoware_api/*
  - name: behavior_planning_container
    type: ros2_component_container_mt
    nodes:
      - /planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner
      - /planning/scenario_planning/lane_driving/behavior_planning/behavior_velocity_planner
  - name: motion_planning_container
    type: ros2_component_container_mt
    nodes:
      - /planning/scenario_planning/lane_driving/motion_planning/elastic_band_smoother
      - /planning/scenario_planning/lane_driving/motion_planning/path_optimizer
      - /planning/scenario_planning/lane_driving/motion_planning/motion_velocity_planner
      # - /planning/scenario_planning/lane_driving/motion_planning/surround_obstacle_checker

