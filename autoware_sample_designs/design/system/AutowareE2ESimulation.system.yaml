autoware_system_design_format: 0.3.2

name: AutowareE2ESimulation.system

variables:
  # common variables
  - name: config_path
    value: $(find-pkg-share autoware_sample_designs)/config
  - name: vehicle_model
    value: sample_vehicle
  - name: data_path
    value: $(env HOME)/autoware_data/ml_models
  - name: lanelet2_map_file
    value: lanelet2_map.osm
  - name: pointcloud_map_file
    value: pointcloud_map.pcd
  # vehicle-specific variables
  - name: config_dir
    value: $(find-pkg-share sample_sensor_kit_description)/config
  # environment variables
  - name: map_path
    value: $(env HOME)/autoware_data/maps/nishishinjuku_autoware_map
  - name: check_external_emergency_heartbeat
    value: false

variable_files:
  - name: vehicle_info
    value: $(find-pkg-share sample_vehicle_description)/config/vehicle_info.param.yaml

modes:
  - name: E2ESimulation
    description: E2E simulation mode using AWSIM
    default: true

parameter_sets:
  - e2e_simulation.parameter_set

components:
  # Middleware
  - name: global_parameter_loader
    entity: GlobalParameterLoader.node
    path: /ros2_system/global_parameter_loader
    compute_unit: main_ecu
    parameter_set: sample_system_global_parameter_loader.parameter_set
  - name: robot_state_publisher
    entity: SampleSystemRobotStatePublisher.node
    path: /ros2_system/robot_state_publisher
    compute_unit: main_ecu

  # ADAPI
  - name: api
    entity: SampleSensorKitADAPIWrapper.node
    compute_unit: main_ecu

  # SENSING
  - name: sensing
    entity: SampleSensorKitAWSIM.module
    compute_unit: main_ecu
    parameter_set: sample_system_sensing.parameter_set

  # MAP/LOCALIZATION
  - name: map
    entity: Tier4MapWrapper.node
    compute_unit: main_ecu
  - name: localization
    entity: Tier4LocalizationWrapper.node
    compute_unit: main_ecu

  # PERCEPTION
  - name: perception
    entity: PerceptionE2ESimulation.module
    compute_unit: main_ecu
    parameter_set: e2e_simulation_perception.parameter_set

  # PLANNING
  - name: planning
    entity: Planning.module
    compute_unit: main_ecu
    parameter_set: universe_planning.parameter_set
  # CONTROL
  - name: control
    entity: Control.module
    compute_unit: main_ecu
    parameter_set: universe_control.parameter_set

  # SYSTEM
  - name: system
    entity: Tier4SystemWrapper.node
    compute_unit: main_ecu

  # SIMULATOR
  - name: awsim
    entity: SampleAWSIM.node
    compute_unit: dummy_ecu

node_groups:
  - name: pointcloud_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /sensing/lidar/concatenate_and_time_sync
      - /perception/obstacle_segmentation/crop_box_filter
      - /perception/obstacle_segmentation/common_ground_filter
      - /perception/obstacle_segmentation/pointcloud_map_filter/voxel_grid_downsample_filter
      - /perception/obstacle_segmentation/clustering/*
      - /perception/occupancy_grid_map/occupancy_grid_map_node
  - name: lidar_top_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /sensing/lidar/top/*
  - name: traffic_light_node_container
    type: ros2_component_container_mt_ipc
    nodes:
      - /perception/traffic_light_recognition/traffic_light/classifier_pedestrian
      - /perception/traffic_light_recognition/traffic_light/classifier_car
  - name: control_container
    type: ros2_component_container_mt
    nodes:
      - /control/shift_decider
      - /control/vehicle_cmd_gate
      - /control/operation_mode_transition_manager
      - /control/trajectory_follower
  - name: control_check_container
    type: ros2_component_container_mt
    nodes:
      - /control/lane_departure_checker
      - /control/control_validator
      - /control/autonomous_emergency_braking
      - /control/collision_detector
      # - /control/obstacle_collision_checker
      # - /control/predicted_path_checker
  - name: mission_planner_container
    type: ros2_component_container_mt
    nodes:
      - /planning/mission_planning/mission_planner
      - /planning/mission_planning/route_selector
  - name: behavior_planning_container
    type: ros2_component_container_mt
    nodes:
      - /planning/scenario_planning/lane_driving/behavior_planning/behavior_path_planner
      - /planning/scenario_planning/lane_driving/behavior_planning/behavior_velocity_planner
  - name: motion_planning_container
    type: ros2_component_container_mt
    nodes:
      - /planning/scenario_planning/lane_driving/motion_planning/elastic_band_smoother
      - /planning/scenario_planning/lane_driving/motion_planning/path_optimizer
      - /planning/scenario_planning/lane_driving/motion_planning/motion_velocity_planner
      # - /planning/scenario_planning/lane_driving/motion_planning/surround_obstacle_checker

connections:
  # SENSING
  - - awsim.publisher.sensing/lidar/top/pointcloud_raw_ex
    - sensing.subscriber.lidar/top/pointcloud_raw_ex
  - - awsim.publisher.sensing/imu/tamagawa/imu_raw
    - sensing.subscriber.imu/tamagawa/imu_raw
  - - awsim.publisher.vehicle/status/velocity_status
    - sensing.subscriber.velocity_status
  - - localization.publisher.kinematic_state
    - sensing.subscriber.odometry
  - - localization.publisher.pose_estimator/pose_with_covariance
    - sensing.subscriber.pose_ndt

  # LOCALIZATION
  - - map.publisher.vector_map
    - localization.subscriber.lanelet_map
  - - map.publisher.pointcloud_map
    - localization.subscriber.pointcloud_map
  - - sensing.publisher.lidar/concatenated/pointcloud
    - localization.subscriber.pointcloud
  - - sensing.publisher.imu/imu_data
    - localization.subscriber.imu
  - - sensing.publisher.vehicle_velocity_converter/twist_with_covariance
    - localization.subscriber.twist
  - - awsim.publisher.sensing/gnss/pose_with_covariance
    - localization.subscriber.gnss_pose_with_covariance
  - - api.publisher.localization/initialization_state
    - localization.subscriber.initialization_state

  # PERCEPTION
  - - sensing.publisher.lidar/concatenated/pointcloud
    - perception.subscriber.concatenated_pointcloud
  - - map.publisher.vector_map
    - perception.subscriber.vector_map
  - - map.publisher.pointcloud_map
    - perception.subscriber.pointcloud_map
  - - map.server.get_differential_pointcloud_map
    - perception.client.service_pointcloud_map_diff
  - - localization.publisher.kinematic_state
    - perception.subscriber.kinematic_state
  - - planning.publisher.mission_planning/route
    - perception.subscriber.route
  - - awsim.publisher.sensing/camera/traffic_light/image_raw
    - perception.subscriber.traffic_camera/image
  - - awsim.publisher.sensing/camera/traffic_light/camera_info
    - perception.subscriber.traffic_camera/camera_info

  # PLANNING
  - - map.publisher.vector_map
    - planning.subscriber.vector_map
  - - localization.publisher.kinematic_state
    - planning.subscriber.odometry
  - - localization.publisher.acceleration
    - planning.subscriber.acceleration
  - - perception.publisher.occupancy_grid_map/map
    - planning.subscriber.occupancy_grid_map
  - - perception.publisher.object_recognition/objects
    - planning.subscriber.objects
  - - perception.publisher.obstacle_segmentation/pointcloud
    - planning.subscriber.pointcloud
  - - perception.publisher.traffic_light_recognition/traffic_signals
    - planning.subscriber.traffic_signals
  - - system.publisher.operation_mode/state
    - planning.subscriber.operation_mode_state
  - - control.publisher.command/control_cmd
    - planning.subscriber.control_cmd
  - - control.publisher.predicted_trajectory
    - planning.subscriber.predicted_trajectory
  - - api.publisher.operation_mode/state
    - planning.subscriber.api_operation_mode_state

  # CONTROL
  - - planning.publisher.trajectory
    - control.subscriber.trajectory
  - - planning.publisher.path_with_lane_id
    - control.subscriber.path_with_lane_id
  - - planning.publisher.mission_planning/route
    - control.subscriber.route
  - - planning.publisher.route_state
    - control.subscriber.route_state
  - - planning.publisher.turn_indicators_cmd
    - control.subscriber.planning_turn_indicators_cmd
  - - planning.publisher.hazard_lights_cmd
    - control.subscriber.hazard_lights_cmd
  - - map.publisher.vector_map
    - control.subscriber.vector_map
  - - localization.publisher.kinematic_state
    - control.subscriber.odometry
  - - localization.publisher.acceleration
    - control.subscriber.acceleration
  - - perception.publisher.object_recognition/objects
    - control.subscriber.objects
  - - perception.publisher.obstacle_segmentation/pointcloud
    - control.subscriber.pointcloud
  - - sensing.publisher.imu/imu_data
    - control.subscriber.imu
  - - system.publisher.operation_mode/state
    - control.subscriber.operation_mode_state
  - - system.publisher.fail_safe/mrm_state
    - control.subscriber.mrm_state
  - - system.publisher.emergency/control_cmd
    - control.subscriber.emergency_control_cmd
  - - system.publisher.emergency/turn_indicators_cmd
    - control.subscriber.emergency_turn_indicators_cmd
  - - system.publisher.emergency/hazard_lights_cmd
    - control.subscriber.emergency_hazard_lights_cmd
  - - system.publisher.emergency/gear_cmd
    - control.subscriber.emergency_gear_cmd
  - - api.publisher.operation_mode/state
    - control.subscriber.api_operation_mode_state
  - - api.publisher.autoware/state
    - control.subscriber.autoware_state
  - - api.publisher.*
    - control.subscriber.*
  - - awsim.publisher.vehicle/status/velocity_status
    - control.subscriber.velocity_status
  - - awsim.publisher.vehicle/status/steering_status
    - control.subscriber.steering_status
  - - awsim.publisher.vehicle/status/gear_status
    - control.subscriber.gear_status
  - - awsim.publisher.vehicle/status/control_mode
    - control.subscriber.control_mode_report

  # SYSTEM
  - - localization.publisher.kinematic_state
    - system.subscriber.kinematic_state
  - - planning.publisher.route
    - system.subscriber.planning/route
  - - control.publisher.command/control_cmd
    - system.subscriber.control_cmd
  - - control.publisher.command/gear_cmd
    - system.subscriber.gear_cmd

  # ADAPI
  - - localization.publisher.initialization_state
    - api.subscriber.localization/initialization_state
  - - localization.publisher.kinematic_state
    - api.subscriber.localization/kinematic_state
  - - planning.publisher.route
    - api.subscriber.planning/route
  - - planning.server.clear_route
    - api.client.routing/clear_route
  - - system.publisher.fail_safe/mrm_state
    - api.subscriber.system/fail_safe/mrm_state

  # SIMULATOR
  - - control.publisher.command/control_cmd
    - awsim.subscriber.control/command/control_cmd
  - - control.publisher.command/gear_cmd
    - awsim.subscriber.control/command/gear_cmd
  - - control.publisher.command/hazard_lights_cmd
    - awsim.subscriber.control/command/hazard_lights_cmd
  - - control.publisher.command/turn_indicators_cmd
    - awsim.subscriber.control/command/turn_indicators_cmd

remaps:
  - source: control.publisher.engage
    topic: /autoware/engage
  - source: control.publisher.is_autonomous_available
    topic: /system/operation_mode/state
  - source: control.publisher.external_emergency
    topic: /api/autoware/get/emergency
  - source: control.publisher.api/engage
    topic: /api/autoware/get/engage
  - source: control.server.engage_service
    topic: /api/autoware/set/engage
  - source: control.server.external_emergency_service
    topic: /api/autoware/set/emergency
  - source: api.publisher.external/local/gear_cmd
    topic: /external/local/gear_cmd
  - source: api.publisher.external/local/hazard_lights_cmd
    topic: /external/local/hazard_lights_cmd
  - source: api.publisher.external/local/heartbeat
    topic: /external/local/heartbeat
  - source: api.publisher.external/local/pedals_cmd
    topic: /external/local/pedals_cmd
  - source: api.publisher.external/local/steering_cmd
    topic: /external/local/steering_cmd
  - source: api.publisher.external/local/turn_indicators_cmd
    topic: /external/local/turn_indicators_cmd
  - source: api.publisher.external/remote/gear_cmd
    topic: /external/remote/gear_cmd
  - source: api.publisher.external/remote/hazard_lights_cmd
    topic: /external/remote/hazard_lights_cmd
  - source: api.publisher.external/remote/heartbeat
    topic: /external/remote/heartbeat
  - source: api.publisher.external/remote/pedals_cmd
    topic: /external/remote/pedals_cmd
  - source: api.publisher.external/remote/steering_cmd
    topic: /external/remote/steering_cmd
  - source: api.publisher.external/remote/turn_indicators_cmd
    topic: /external/remote/turn_indicators_cmd
  - source: api.publisher.autoware/state
    topic: /autoware/state
  # GNSS
  - source: awsim.publisher.sensing/gnss/pose
    topic: /sensing/gnss/pose
  - source: awsim.publisher.sensing/gnss/pose_with_covariance
    topic: /sensing/gnss/pose_with_covariance
  # IMU
  - source: awsim.publisher.sensing/imu/tamagawa/imu_raw
    topic: /sensing/imu/tamagawa/imu_raw
  # LIDAR
  - source: awsim.publisher.sensing/lidar/top/pointcloud_raw
    topic: /sensing/lidar/top/pointcloud_raw
  - source: awsim.publisher.sensing/lidar/top/pointcloud_raw_ex
    topic: /sensing/lidar/top/pointcloud_raw_ex
  # CAMERA
  - source: awsim.publisher.sensing/camera/traffic_light/camera_info
    topic: /sensing/camera/traffic_light/camera_info
  - source: awsim.publisher.sensing/camera/traffic_light/image_raw
    topic: /sensing/camera/traffic_light/image_raw
  # VEHICLE
  - source: awsim.publisher.vehicle/status/control_mode
    topic: /vehicle/status/control_mode
  - source: awsim.publisher.vehicle/status/gear_status
    topic: /vehicle/status/gear_status
  - source: awsim.publisher.vehicle/status/hazard_lights_status
    topic: /vehicle/status/hazard_lights_status
  - source: awsim.publisher.vehicle/status/steering_status
    topic: /vehicle/status/steering_status
  - source: awsim.publisher.vehicle/status/turn_indicators_status
    topic: /vehicle/status/turn_indicators_status
  - source: awsim.publisher.vehicle/status/velocity_status
    topic: /vehicle/status/velocity_status
