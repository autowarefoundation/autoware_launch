      lon_acc_lim_for_lon_vel: [5.0, 5.0, 5.0, 4.0]
      lon_jerk_lim_for_lon_acc: [80.0, 5.0, 5.0, 4.0]
      lat_acc_lim_for_steer_cmd: [1.5, 1.5, 1.5, 1.5]
      lat_jerk_lim_for_steer_cmd: [1.0, 1.0, 1.0, 1.0]
      lat_jerk_lim_for_steer_rate: 1.0
      steer_cmd_diff_lim_from_current_steer: [1.0, 1.0, 1.0, 0.8]
