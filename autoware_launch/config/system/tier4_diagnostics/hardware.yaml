units:
  - path: /hardware/autonomous_available
    type: and
    list:
      - { type: link, link: /hardware/emergency_stop }
      - { type: link, link: /hardware/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /hardware/in_lane_emergency_stop }
      - { type: link, link: /hardware/in_lane_moderate_stop }
      - { type: link, link: /hardware/comfortable_stop }

  - path: /hardware/comfortable_stop_available
    type: and
    list:
      - { type: link, link: /hardware/emergency_stop }
      - { type: link, link: /hardware/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /hardware/in_lane_emergency_stop }
      - { type: link, link: /hardware/in_lane_moderate_stop }

  - path: /hardware/in_lane_moderate_stop_available
    type: and
    list:
      - { type: link, link: /hardware/emergency_stop }
      - { type: link, link: /hardware/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /hardware/in_lane_emergency_stop }

  - path: /hardware/in_lane_emergency_stop_available
    type: and
    list:
      - { type: link, link: /hardware/emergency_stop }
      - { type: link, link: /hardware/sub_ecu_in_lane_moderate_stop }

