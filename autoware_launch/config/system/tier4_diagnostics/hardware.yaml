  # NOTE: Please modify this section according to your environment and requirements.
  # *******************************************************************************
  - path: /hardware/emergency_stop
    type: and

  - path: /hardware/sub_ecu_in_lane_moderate_stop
    type: and
    list:
      # Main ECU
      - { type: link, link: /hardware/cpu/001-temperature }
      - { type: link, link: /hardware/cpu/002-usage-error }
      - { type: link, link: /hardware/cpu/003-load_average }
      - { type: link, link: /hardware/cpu/004-throttling-error }
      - { type: link, link: /hardware/cpu/005-frequency }
      - { type: link, link: /hardware/hdd/001-temperature-error }
      - { type: link, link: /hardware/hdd/002-usage-error }
      - { type: link, link: /hardware/hdd/003-connection-error }
      - { type: link, link: /hardware/hdd/004-total_written }
      - { type: link, link: /hardware/hdd/006-soft_error-error }
      - { type: link, link: /hardware/hdd/007-load-error }
      - { type: link, link: /hardware/memory/001-usage-error }
      - { type: link, link: /hardware/memory/002-ecc-error }
      - { type: link, link: /hardware/network/001-usage }
      - { type: link, link: /hardware/network/002-traffic }
      - { type: link, link: /hardware/network/003-crc-error }
      - { type: link, link: /hardware/network/004-packet_reassembles-error }
      - { type: link, link: /hardware/gpu/001-temperature-error }
      - { type: link, link: /hardware/gpu/002-usage-error }
      - { type: link, link: /hardware/gpu/003-memory-error }
      - { type: link, link: /hardware/gpu/004-throttling-error }
      - { type: link, link: /hardware/gpu/005-frequency-error }
      # Sub ECU
      - { type: link, link: /hardware/sub/cpu/001-temperature }
      - { type: link, link: /hardware/sub/cpu/002-usage-error }
      - { type: link, link: /hardware/sub/cpu/003-load_average }
      - { type: link, link: /hardware/sub/cpu/004-throttling-error }
      - { type: link, link: /hardware/sub/cpu/005-frequency }
      - { type: link, link: /hardware/sub/hdd/001-temperature-error }
      - { type: link, link: /hardware/sub/hdd/002-usage-error }
      - { type: link, link: /hardware/sub/hdd/003-connection-error }
      - { type: link, link: /hardware/sub/hdd/004-total_written }
      - { type: link, link: /hardware/sub/hdd/006-soft_error-error }
      - { type: link, link: /hardware/sub/hdd/007-load-error }
      - { type: link, link: /hardware/sub/memory/001-usage-error }
      - { type: link, link: /hardware/sub/memory/002-ecc-error }
      - { type: link, link: /hardware/sub/network/001-usage }
      - { type: link, link: /hardware/sub/network/002-traffic }
      - { type: link, link: /hardware/sub/network/003-crc-error }
      - { type: link, link: /hardware/sub/network/004-packet_reassembles-error }
      - { type: link, link: /hardware/sub/gpu/001-temperature-error }
      - { type: link, link: /hardware/sub/gpu/002-usage-error }
      - { type: link, link: /hardware/sub/gpu/003-memory-error }
      - { type: link, link: /hardware/sub/gpu/004-throttling-error }
      - { type: link, link: /hardware/sub/gpu/005-frequency-error }
      # Perception1 ECU
      - { type: link, link: /hardware/perception1/cpu/001-temperature }
      - { type: link, link: /hardware/perception1/cpu/002-usage-error }
      - { type: link, link: /hardware/perception1/hdd/002-usage-error }
      - { type: link, link: /hardware/perception1/hdd/003-connection-error }
      - { type: link, link: /hardware/perception1/memory/001-usage-error }
      - { type: link, link: /hardware/perception1/network/001-usage }
      - { type: link, link: /hardware/perception1/network/003-crc-error }
      - { type: link, link: /hardware/perception1/network/004-packet_reassembles-error }
      - { type: link, link: /hardware/perception1/gpu/001-temperature-error }
      - { type: link, link: /hardware/perception1/gpu/002-usage-error }

      # Perception2 ECU
      - { type: link, link: /hardware/perception2/cpu/001-temperature }
      - { type: link, link: /hardware/perception2/cpu/002-usage-error }
      - { type: link, link: /hardware/perception2/hdd/002-usage-error }
      - { type: link, link: /hardware/perception2/hdd/003-connection-error }
      - { type: link, link: /hardware/perception2/memory/001-usage-error }
      - { type: link, link: /hardware/perception2/network/001-usage }
      - { type: link, link: /hardware/perception2/network/003-crc-error }
      - { type: link, link: /hardware/perception2/network/004-packet_reassembles-error }
