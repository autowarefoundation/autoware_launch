units:
  - path: /autoware/modes/sub_ecu_standby
    type: ok

  - path: /autoware/modes/sub_ecu_in_lane_moderate_stop
    type: and
    list:
      - { type: link, link: /debug/injection/sub_ecu_in_lane_moderate_stop_available }

  - path: /notification/sub/faults
    type: and
    list:
      - { type: link, link: /redundancy/main_ecu_fault }
      - { type: link, link: /redundancy/sub_ecu_fault }
      - { type: link, link: /redundancy/main_vcu_fault }
      - { type: link, link: /redundancy/sub_vcu_fault }
      - { type: link, link: /redundancy/main_ecu_to_sub_ecu_link_fault }
      - { type: link, link: /redundancy/main_ecu_to_main_vcu_link_fault }
      - { type: link, link: /redundancy/main_ecu_to_sub_vcu_link_fault }
      - { type: link, link: /redundancy/sub_ecu_to_main_vcu_link_fault }
      - { type: link, link: /redundancy/sub_ecu_to_sub_vcu_link_fault }
      - { type: link, link: /redundancy/main_vcu_to_sub_vcu_link_fault }

  # diag
  - path: /debug/injection/sub_ecu_in_lane_moderate_stop_available
    type: diag
    node: ""
    name: injection_sub_ecu_in_lane_moderate_stop_available
    timeout: 1.0
    latch: 0.0

  - path: /redundancy/redundancy_switcher
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: redundancy_switcher_status
    timeout: 3.0

  - path: /redundancy/main_ecu_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_ecu_fault
    timeout: 2.0

  - path: /redundancy/sub_ecu_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: sub_ecu_fault
    timeout: 2.0

  - path: /redundancy/main_vcu_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_vcu_fault
    timeout: 2.0

  - path: /redundancy/sub_vcu_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: sub_vcu_fault
    timeout: 2.0

  - path: /redundancy/main_ecu_to_sub_ecu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_ecu_to_sub_ecu_link_fault
    timeout: 2.0

  - path: /redundancy/main_ecu_to_main_vcu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_ecu_to_main_vcu_link_fault
    timeout: 2.0

  - path: /redundancy/main_ecu_to_sub_vcu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_ecu_to_sub_vcu_link_fault
    timeout: 2.0

  - path: /redundancy/sub_ecu_to_main_vcu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: sub_ecu_to_main_vcu_link_fault
    timeout: 2.0

  - path: /redundancy/sub_ecu_to_sub_vcu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: sub_ecu_to_sub_vcu_link_fault
    timeout: 2.0

  - path: /redundancy/main_vcu_to_sub_vcu_link_fault
    type: diag
    node: sub_ecu_redundancy_switcher_interface
    name: main_vcu_to_sub_vcu_link_fault
    timeout: 2.0
