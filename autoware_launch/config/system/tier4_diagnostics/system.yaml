    timeout: 3.0
    latch: 0.0

  - path: /system/clock
    type: and
    list:
      - { type: link, link: /system/clock-main_sys }
      - { type: link, link: /system/clock-main_ptp0 }
      - { type: link, link: /system/clock-sensor@rear_upper/lidar }
