units:
  - path: /system/autonomous_available
    type: and
    list:
      - { type: link, link: /system/emergency_stop }
      - { type: link, link: /system/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /system/in_lane_emergency_stop }
      - { type: link, link: /system/in_lane_moderate_stop }
      - { type: link, link: /system/comfortable_stop }

  - path: /system/comfortable_stop_available
    type: and
    list:
      - { type: link, link: /system/emergency_stop }
      - { type: link, link: /system/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /system/in_lane_emergency_stop }
      - { type: link, link: /system/in_lane_moderate_stop }

  - path: /system/in_lane_moderate_stop_available
    type: and
    list:
      - { type: link, link: /system/emergency_stop }
      - { type: link, link: /system/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /system/in_lane_emergency_stop }

  - path: /system/in_lane_emergency_stop_available
    type: and
    list:
      - { type: link, link: /system/emergency_stop }
      - { type: link, link: /system/sub_ecu_in_lane_moderate_stop }

  # *******************************************************************************
  # NOTE: Please modify this section according to your environment and requirements.
  # *******************************************************************************
  - path: /system/emergency_stop
    type: and

  - path: /system/comfortable_stop
    type: and
    list:
      - { type: link, link: /system/002-latency/total-latency-error }
      - { type: link, link: /system/005-daytime_monitor-error }
      - { type: link, link: /system/009-dssad-error }
      - { type: link, link: /system/018-emergency_vehicle_main-error }
      - { type: link, link: /system/019-event_record_status-error }
      - { type: link, link: /system/020-mrm-request-error }
      # - { type: link, link: /system/clock-error }

  - path: /system/in_lane_moderate_stop
    type: and
    list:
      - { type: link, link: /system/006-vehicle_stuck_checker }
      - { type: link, link: /system/command_mode_decider/ready-error }
      - { type: link, link: /system/015-velocity-status-error }
      - { type: link, link: /system/016-steering-status-error }

  - path: /system/in_lane_emergency_stop
    type: and

  - path: /system/sub_ecu_in_lane_moderate_stop
    type: and

  - path: /system/none
    type: and
    list:
      - { type: link, link: /system/010-v2x_jpn_signal }
      - { type: link, link: /system/011-v2x_omron }
      - { type: link, link: /system/012-fms_connection }

  - path: /system/002-latency/total-latency-error
    type: warn-to-ok
    item:
      type: link
      link: /system/002-latency/total-latency

  - path: /system/command_mode_decider/ready-error
    type: warn-to-ok
    item:
      type: link
      link: /system/command_mode_decider/ready

  - path: /system/005-daytime_monitor-error
    type: warn-to-ok
    item:
      type: link
      link: /system/005-daytime_monitor

  - path: /system/006-vehicle_stuck_checker-error
    type: warn-to-ok
    item:
      type: link
      link: /system/006-vehicle_stuck_checker

  - path: /system/009-dssad-error
    type: warn-to-ok
    item:
      type: link
      link: /system/009-dssad

  - path: /system/015-velocity-status-error
    type: warn-to-ok
    item:
      type: link
      link: /system/015-velocity-status

  - path: /system/016-steering-status-error
    type: warn-to-ok
    item:
      type: link
      link: /system/016-steering-status

  - path: /system/018-emergency_vehicle_main-error
    type: warn-to-ok
    item:
      type: link
      link: /system/018-emergency_vehicle_main

  - path: /system/019-event_record_status-error
    type: warn-to-ok
    item:
      type: link
      link: /system/019-event_record_status

  - path: /system/020-mrm-request-error
    type: warn-to-ok
    item:
      type: link
      link: /system/020-mrm-request

  - path: /system/clock-error
    type: warn-to-ok
    item:
      type: link
      link: /system/clock

  - path: /system/002-latency/total-latency
    type: diag
    node: pipeline_latency_monitor
    name: Total Latency
    timeout: 1.0
    latch: 0.0

  - path: /system/005-daytime_monitor
    type: diag
    node: daytime_monitor
    name: daytime_status
    timeout: 1.0
    latch: 0.0

  - path: /system/006-vehicle_stuck_checker
    type: diag
    node: vehicle_stuck_checker
    name: vehicle_stuck_check
    timeout: 1.0
    latch: 0.0

  - path: /system/009-dssad
    type: diag
    node: dssad_packer
    name: dssad_record_status
    timeout: 3.0
    latch: 0.0

  - path: /system/010-v2x_jpn_signal
    type: diag
    node: jpn_signal_mqtt_receiver
    name: mqt_status
    timeout: 1.0
    latch: 0.0

  - path: /system/011-v2x_omron
    type: diag
    node: omron_signal_mqtt_receiver
    name: mqt_status
    timeout: 1.0
    latch: 0.0

  - path: /system/012-fms_connection
    type: diag
    node: ""
    name: edge_core_internet_connection
    timeout: 10.0
    latch: 0.0

  - path: /system/command_mode_decider/ready
    type: diag
    node: command_mode_decider
    name: ready
    timeout: 3.0
    latch: 0.0

  - path: /system/015-velocity-status
    type: diag
    node: topic_state_monitor_vehicle_status_velocity_status
    name: vehicle_topic_status
    timeout: 1.0
    latch: 0.0

  - path: /system/016-steering-status
    type: diag
    node: topic_state_monitor_vehicle_status_steering_status
