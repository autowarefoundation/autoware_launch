units:
  - path: /sensing/autonomous_available
    type: and
    list:
      - { type: link, link: /sensing/emergency_stop }
      - { type: link, link: /sensing/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /sensing/in_lane_emergency_stop }
      - { type: link, link: /sensing/in_lane_moderate_stop }
      - { type: link, link: /sensing/comfortable_stop }

  - path: /sensing/comfortable_stop_available
    type: and
    list:
      - { type: link, link: /sensing/emergency_stop }
      - { type: link, link: /sensing/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /sensing/in_lane_emergency_stop }
      - { type: link, link: /sensing/in_lane_moderate_stop }

  - path: /sensing/in_lane_moderate_stop_available
    type: and
