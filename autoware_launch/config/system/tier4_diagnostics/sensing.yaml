  # Diagnostics paths
  # imu
  - path: /sensing/imu/008-monitor
    type: diag
    node: imu_monitor
    name: yaw_rate_status
    timeout: 3.0
    # latch: 0.0
    hysteresis: 0.5
  - path: /sensing/imu/001-connection
    type: diag
    node: topic_state_monitor_imu_data
    name: imu_topic_status
    timeout: 3.0
    # latch: 0.0
    hysteresis: 0.0
  - path: /sensing/imu/002-rate
    type: diag
    node: /sensing/imu/tamagawa/tag_can_driver
    name: rate bound check
    timeout: 3.0
    # latch: 0.0
    hysteresis: 1.0
  - path: /sensing/imu/003-gyro_bias
    type: diag
    node: gyro_bias_scale_validator
    name: gyro_bias_scale_validator
    timeout: 3.0
    # latch: 0.0
    hysteresis: 1.0
  # gnss
  - path: /sensing/gnss/002-quality
    type: diag
    node: /sensing/gnss/septentrio
    name: Quality indicators
    timeout: 5.0
    # latch: 0.0
    hysteresis: 0.2
  - path: /sensing/gnss/003-receiver-status
