      - { type: link, link: /sensing/emergency_stop }
      - { type: link, link: /sensing/sub_ecu_in_lane_moderate_stop }
      - { type: link, link: /sensing/in_lane_emergency_stop }

  - path: /sensing/in_lane_emergency_stop_available
    type: and
    list:
      - { type: link, link: /sensing/emergency_stop }
      - { type: link, link: /sensing/sub_ecu_in_lane_moderate_stop }

  # *******************************************************************************
  # NOTE: Please modify this section according to your environment and requirements.
  # *******************************************************************************
  - path: /sensing/emergency_stop
    type: and

  - path: /sensing/comfortable_stop
    type: and
    list:
      - { type: link, link: /sensing/camera/001-connection-error }
      - { type: link, link: /sensing/camera/003-sync-error }
      - { type: link, link: /sensing/camera/004-image-error }
      - { type: link, link: /sensing/camera/006-hw-diag-error }
      - { type: link, link: /sensing/radar/001-connection-error }
      - { type: link, link: /sensing/radar/002-dynamics-error }
      - { type: link, link: /sensing/radar/003-internal-error }
      - { type: link, link: /sensing/radar/004-blockage-error }
      - { type: link, link: /sensing/radar/005-object-rate-error }
      - { type: link, link: /sensing/radar/006-detections-rate-error }

  - path: /sensing/in_lane_moderate_stop
    type: and
    list:
      - { type: link, link: /sensing/lidar/concat_status-error }
      - { type: link, link: /sensing/lidar/preprocessor-error }
      - { type: link, link: /sensing/lidar/001-connection-error }
      - { type: link, link: /sensing/lidar/002-status-error }
      - { type: link, link: /sensing/lidar/003-ptp-error }
      - { type: link, link: /sensing/lidar/004-blockage-error }
      - { type: link, link: /sensing/visibility_validation-error }

  - path: /sensing/in_lane_emergency_stop
    type: and

  - path: /sensing/sub_ecu_in_lane_moderate_stop
    type: and
    list:
      - { type: link, link: /sensing/imu/001-connection-error }
      - { type: link, link: /sensing/imu/002-rate-error }
      - { type: link, link: /sensing/imu/003-gyro_bias-error }
      - { type: link, link: /sensing/imu/008-monitor-error }

  - path: /sensing/none
    type: and
    list:
      - { type: link, link: /sensing/gnss/002-quality }
      - { type: link, link: /sensing/gnss/003-receiver-status }
      - { type: link, link: /sensing/gnss/004-osnma }
      - { type: link, link: /sensing/gnss/005-aim+status }
      - { type: link, link: /sensing/gnss/006-navsatfix-rate-bound-check }
      - { type: link, link: /sensing/gnss/007-poscovgeodetic-rate-bound-check }
      - { type: link, link: /sensing/gnss/008-pvtgeodetic-rate-bound-check }
      - { type: link, link: /sensing/gnss/009-liveness }

