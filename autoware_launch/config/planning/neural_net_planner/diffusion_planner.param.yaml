/**:
  ros__parameters:
    plugins_path: $(find-pkg-share autoware_tensorrt_plugins)/plugins/libautoware_tensorrt_plugins.so
    model:
      type: "single_step"
      backend: "tensorrt" # "tensorrt" "ort_cpu" "ort_cuda" "ort_tensorrt"
      precision: "fp32"
      use_cuda_graph: false
      base_model_directory: /opt/autoware/mlmodels/diffusion_planner_for_x2
      args_filename: args.json
      single_step_model:
        onnx_model_filename: diffusion_planner.onnx
      multi_step_model:
        encoder_onnx_model_filename: diffusion_planner_encoder.onnx
        decoder_onnx_model_filename: diffusion_planner_decoder.onnx
        turn_indicator_onnx_model_filename: diffusion_planner_turn_indicator.onnx
        dpm_solver_steps: 10
    planning_frequency_hz: 10.0
    ignore_neighbors: false
    traffic_light_group_msg_timeout_seconds: 0.3  # 0.3 = 0.15 (basic pipeline latency) + 0.1 (maximum delay due to 10Hz timer callback in diffusion planner) + 0.05 (safety margin)
    batch_size: 1
    temperature: [0.0]
    velocity_smoothing_window: 8
    stopping_threshold: 0.3
    turn_indicator_keep_offset: -1.75
    turn_indicator_hold_duration: 1.0
    shift_x: false
    delay_step: 0
    line_string_max_step_m: 5.0
    use_time_interpolation: true
    planning_factor:
      enable_stop: true
      enable_slowdown: false
      stop_keep_duration_threshold: 1.0  # [s]
      stop_velocity_threshold: 0.1       # [m/s]
      slowdown_accel_threshold: -0.3     # [m/s^2]
    debug_params:
      publish_debug_route: true
      publish_debug_map: false
      publish_debug_linestrings: true
