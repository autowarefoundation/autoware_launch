autoware_system_design_format: 0.3.0

# module information
name: MotionPlanning.module

instances:
  - name: elastic_band_smoother
    entity: ElasticBandSmoother.node
  - name: path_optimizer
    entity: PathOptimizer.node
  - name: motion_velocity_planner
    entity: MotionVelocityPlanner.node

# interfaces
subscribers:
  - name: path
  - name: vector_map
  - name: odometry
  - name: accel
  - name: steering_status
  - name: objects
  - name: no_ground_pointcloud
  - name: traffic_signals
  - name: occupancy_grid_map
  - name: route
  - name: operation_mode_state
  - name: control_cmd
  - name: predicted_trajectory

publishers:
  - name: trajectory
  - name: planning_factors/dynamic_obstacle_stop
  - name: planning_factors/obstacle_cruise
  - name: planning_factors/obstacle_slow_down
  - name: planning_factors/obstacle_stop
  - name: planning_factors/out_of_lane
  - name: planning_factors/road_user_stop
  - name: planning_factors/run_out
  - name: velocity_limit
  - name: clear_velocity_limit

connections:
  - - subscriber.path
    - elastic_band_smoother.subscriber.path
  - - subscriber.odometry
    - elastic_band_smoother.subscriber.odometry
  - - elastic_band_smoother.publisher.path
    - path_optimizer.subscriber.path
  - - subscriber.odometry
    - path_optimizer.subscriber.odometry
  - - path_optimizer.publisher.trajectory
    - motion_velocity_planner.subscriber.trajectory
  - - subscriber.vector_map
    - motion_velocity_planner.subscriber.vector_map
  - - subscriber.odometry
    - motion_velocity_planner.subscriber.vehicle_odometry
  - - subscriber.accel
    - motion_velocity_planner.subscriber.accel
  - - subscriber.steering_status
    - motion_velocity_planner.subscriber.steering_status
  - - subscriber.objects
    - motion_velocity_planner.subscriber.dynamic_objects
  - - subscriber.no_ground_pointcloud
    - motion_velocity_planner.subscriber.no_ground_pointcloud
  - - subscriber.traffic_signals
    - motion_velocity_planner.subscriber.traffic_signals
  - - subscriber.occupancy_grid_map
    - motion_velocity_planner.subscriber.occupancy_grid
  - - subscriber.route
    - motion_velocity_planner.subscriber.route
  - - subscriber.operation_mode_state
    - motion_velocity_planner.subscriber.operation_mode_state
  - - subscriber.control_cmd
    - motion_velocity_planner.subscriber.control_cmd
  - - subscriber.predicted_trajectory
    - motion_velocity_planner.subscriber.predicted_trajectory
  - - motion_velocity_planner.publisher.trajectory
    - publisher.trajectory
  - - motion_velocity_planner.publisher.planning_factors/dynamic_obstacle_stop
    - publisher.planning_factors/dynamic_obstacle_stop
  - - motion_velocity_planner.publisher.planning_factors/obstacle_cruise
    - publisher.planning_factors/obstacle_cruise
  - - motion_velocity_planner.publisher.planning_factors/obstacle_slow_down
    - publisher.planning_factors/obstacle_slow_down
  - - motion_velocity_planner.publisher.planning_factors/obstacle_stop
    - publisher.planning_factors/obstacle_stop
  - - motion_velocity_planner.publisher.planning_factors/out_of_lane
    - publisher.planning_factors/out_of_lane
  - - motion_velocity_planner.publisher.planning_factors/road_user_stop
    - publisher.planning_factors/road_user_stop
  - - motion_velocity_planner.publisher.planning_factors/run_out
    - publisher.planning_factors/run_out
  - - motion_velocity_planner.publisher.velocity_limit
    - publisher.velocity_limit
  - - motion_velocity_planner.publisher.clear_velocity_limit
    - publisher.clear_velocity_limit
